<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #120d1c; font-family: 'Gowun Dodum', sans-serif; color: #f4efe3; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; }

  .ctl { position: fixed; top: 10px; right: 12px; display: flex; gap: 6px; }
  .ctl span { padding: 7px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; letter-spacing: .06em; }
  .ctl span.on { color: #ffd779; border-color: rgba(255, 214, 120, .7); }
  .boss { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); width: min(46vw, 420px); display: flex; align-items: center; gap: 8px; }
  .bface { flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%; padding: 2px; background: linear-gradient(145deg, #ffe39a, #a8661a); box-shadow: 0 2px 8px rgba(0,0,0,.5); }
  .bface span { display: block; width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 50% 62%, #5a3a24 0 34%, transparent 35%), radial-gradient(circle at 50% 36%, #f2b720 0 46%, #a05a00 47% 100%); position: relative; }
  .bface span::before, .bface span::after { content: ''; position: absolute; top: 56%; width: 6px; height: 3px; border-radius: 2px; background: #ffef9a; box-shadow: 0 0 6px #ffcf4a; }
  .bface span::before { left: 37%; transform: rotate(12deg); } .bface span::after { right: 37%; transform: rotate(-12deg); }
  .bmain { flex: 1; min-width: 0; }
  .bname { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  .bname b { font-family: Jua, sans-serif; font-weight: 400; font-size: 17px; color: #fff3d0; letter-spacing: .02em; }
  .bname i { font-style: normal; font-size: 9px; font-weight: 700; letter-spacing: .18em; color: #2a1206; background: linear-gradient(#ffd779, #e09a2a); padding: 1px 5px; border-radius: 3px; }
  .bbar { position: relative; height: 14px; border-radius: 7px; overflow: hidden; background: #1a0f12; box-shadow: 0 0 0 2px rgba(255, 214, 120, .75), 0 3px 10px rgba(0,0,0,.55); }
  .bbar .layer { position: absolute; inset: 0 auto 0 0; border-radius: 7px; }
  .bbar .next { width: 100%; background: linear-gradient(#9a6bff, #5a32c8); }
  .bbar .trail { position: absolute; inset: 0 auto 0 0; width: 66%; background: #fff1d6; border-radius: 7px; }
  .bbar .now { width: 58%; background: linear-gradient(#ffb15c, #e2401f 70%, #b82a14); }
  .bbar .shine { position: absolute; left: 4px; right: 4px; top: 2px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.35); }
  .bcount { flex: 0 0 auto; font-family: Jua, sans-serif; font-size: 20px; color: #fff3d0; text-shadow: 0 2px 0 #7a3a10, 0 0 8px rgba(0,0,0,.6); margin-top: 16px; }
  .syn { position: fixed; top: 62px; left: 12px; padding: 5px 10px; border-radius: 8px; font-size: 12px; }
  .syn b { color: #9fd3ff; font-weight: 700; margin-right: 6px; }
  .skills { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 10px; }
  .sk { position: relative; width: 78px; height: 92px; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,.18); box-shadow: 0 6px 18px rgba(0,0,0,.45); }
  .sk .face { position: absolute; inset: 0 0 22px 0; background: var(--bg); }
  .sk .face img { position: absolute; left: 50%; bottom: -6px; width: 80px; transform: translateX(-50%); }
  .sk b { position: absolute; left: 0; right: 0; bottom: 0; height: 22px; line-height: 22px; text-align: center; background: rgba(10,8,16,.9); font-size: 11px; font-weight: 700; letter-spacing: .02em; }
  .sk .cd { position: absolute; inset: 0 0 22px 0; background: conic-gradient(rgba(8,6,14,.72) var(--p), transparent 0); display: grid; place-items: center; font-family: Jua, sans-serif; font-size: 24px; color: #fff; }
  .sk.ready { border-color: #ffd779; box-shadow: 0 0 0 2px rgba(255,215,121,.5), 0 0 22px rgba(255,190,80,.65); }
  .sk .ult { position: absolute; top: 4px; right: 4px; font-size: 9px; font-weight: 700; letter-spacing: .08em; color: #1a1206; background: #ffd779; padding: 1px 4px; border-radius: 3px; }
  .cast { position: fixed; left: 50%; top: 17%; opacity: 0; pointer-events: none; transition: opacity .15s; transform: translateX(-50%) skewX(-8deg); text-align: center; padding: 6px 26px; background: linear-gradient(90deg, transparent, rgba(10,8,16,.85) 20%, rgba(10,8,16,.85) 80%, transparent); border-top: 1px solid rgba(255,214,120,.6); border-bottom: 1px solid rgba(255,214,120,.6); }
  .cast b { display: block; font-family: Jua, sans-serif; font-weight: 400; font-size: 26px; color: #ffe2a0; letter-spacing: .04em; }
  .cast small { font-size: 12px; opacity: .8; }
  .dmg { position: fixed; transform: translate(-50%, -50%); font-family: Jua, sans-serif; color: #fff; text-shadow: 0 2px 0 #7a160f, 0 0 10px rgba(255,80,40,.8); pointer-events: none; }
  .dmg.big { font-size: 40px; color: #ffe58a; text-shadow: 0 3px 0 #8a4a00, 0 0 16px rgba(255,190,60,.9); }
  .dmg.big small { display: block; font-size: 13px; color: #fff; letter-spacing: .1em; text-align: center; }
  .dmg.mid { font-size: 24px; }
  .dmg.heal { font-size: 18px; color: #8dffb0; text-shadow: 0 2px 0 #145a2c, 0 0 8px rgba(80,255,140,.7); }
  .unit { position: fixed; transform: translate(-50%, -100%); width: 44px; pointer-events: none; }
  .unit .bar { height: 4px; background: rgba(10,10,14,.75); border-radius: 3px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,.35); }
  .unit .bar i { display: block; height: 100%; background: linear-gradient(#7dff9e, #2fbf62); }
  .unit .nm { display: none; }

  /* 필살기 컷인 */
  .cutin { position: fixed; inset: 0; z-index: 20; pointer-events: none; display: none; }
  .cutin.show { display: block; }
  .cutin .dim { position: absolute; inset: 0; background: rgba(6,4,12,.55); animation: cfade 1.1s ease forwards; }
  .cutin .band { position: absolute; left: -10%; right: -10%; top: 50%; height: 62%; transform: translateY(-50%) skewY(-8deg); background: var(--c1); overflow: hidden; box-shadow: 0 0 0 3px #ffd779, 0 0 40px rgba(255,200,90,.6); animation: cband 1.1s cubic-bezier(.2,.9,.3,1) forwards; }
  .cutin .lines { position: absolute; inset: -50%; background: repeating-conic-gradient(from 0deg at 30% 50%, rgba(255,255,255,.16) 0 2deg, transparent 2deg 9deg); animation: cspin 1.1s linear forwards; }
  .cutin .grad { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.0) 30%, rgba(0,0,0,.55)); }
  .cutin .who { position: absolute; left: 4%; bottom: -12%; height: 125%; transform: skewY(8deg); animation: cwho 1.1s cubic-bezier(.2,.9,.3,1) forwards; filter: drop-shadow(0 0 0 #fff) drop-shadow(6px 6px 0 rgba(0,0,0,.35)); }
  .cutin .who img { height: 100%; }
  .cutin .txt { position: absolute; right: 9%; top: 50%; transform: translateY(-50%) skewY(-8deg); text-align: right; animation: ctxt 1.1s cubic-bezier(.2,.9,.3,1) forwards; }
  .cutin .txt small { display: block; font-size: 13px; letter-spacing: .3em; color: #ffd779; }
  .cutin .txt b { display: block; font-family: Jua, sans-serif; font-weight: 400; font-size: 54px; line-height: 1.05; color: #fff; text-shadow: 0 4px 0 rgba(0,0,0,.4), 0 0 24px rgba(255,215,121,.7); }
  .cutin .txt span { display: block; font-size: 14px; opacity: .9; margin-top: 4px; }
  .cutin.hold .dim, .cutin.hold .band, .cutin.hold .lines, .cutin.hold .who, .cutin.hold .txt { animation-play-state: paused; animation-delay: -.45s; }
  @keyframes cfade { 0% { opacity: 0 } 12% { opacity: 1 } 80% { opacity: 1 } 100% { opacity: 0 } }
  @keyframes cband { 0% { clip-path: inset(0 100% 0 0) } 18% { clip-path: inset(0 0 0 0) } 82% { clip-path: inset(0 0 0 0); opacity: 1 } 100% { clip-path: inset(0 0 0 0); opacity: 0 } }
  @keyframes cwho { 0% { transform: skewY(8deg) translateX(-60%); opacity: 1 } 22% { transform: skewY(8deg) translateX(0); opacity: 1 } 80% { transform: skewY(8deg) translateX(4%); opacity: 1 } 100% { transform: skewY(8deg) translateX(30%); opacity: 0 } }
  @keyframes ctxt { 0% { transform: translateY(-50%) skewY(-8deg) translateX(60%); opacity: 0 } 25% { transform: translateY(-50%) skewY(-8deg) translateX(0); opacity: 1 } 80% { opacity: 1 } 100% { transform: translateY(-50%) skewY(-8deg) translateX(-10%); opacity: 0 } }
  @keyframes cspin { to { transform: rotate(6deg) scale(1.1) } }
  @media (prefers-reduced-motion: reduce) { .cutin * { animation-duration: .01s !important; } }
  .sk { pointer-events: auto; cursor: pointer; }

  .ctl button { font: inherit; color: #f4efe3; padding: 7px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; letter-spacing: .06em; cursor: pointer; }
  .ctl button.on { color: #ffd779; border-color: rgba(255, 214, 120, .7); }
  .sk.dead { filter: grayscale(1) brightness(.5); }
  .sk.dead::after { content: '쓰러짐'; position: absolute; inset: 0 0 22px 0; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #ffb4a8; }
  .dmg { animation: dmgUp .9s ease-out forwards; }
  @keyframes dmgUp { 0% { opacity: 0; margin-top: 8px; } 15% { opacity: 1; margin-top: 0; } 75% { opacity: 1; } 100% { opacity: 0; margin-top: -26px; } }
  .dmg.taken { font-size: 18px; color: #ffb4a8; text-shadow: 0 2px 0 #5a0f0a, 0 0 6px rgba(0,0,0,.6); }
  .dmg.block { font-size: 15px; color: #a8d4ff; text-shadow: 0 2px 0 #12325a; }
  .dmg.info { font-size: 22px; color: #ffe2a0; text-shadow: 0 2px 0 #6a3a10, 0 0 10px rgba(0,0,0,.6); }
  .bcount { transition: transform .2s; } .bcount.pop { transform: scale(1.5); }
  .overlay { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(8,6,14,.66); }
  .overlay[hidden] { display: none; }
  .panel { text-align: center; padding: 18px 26px 20px; border-radius: 14px; min-width: 260px; }
  .panel small { display: block; letter-spacing: .25em; font-size: 11px; color: #ffd779; }
  .panel h2 { font-family: Jua, sans-serif; font-weight: 400; font-size: 34px; margin: 4px 0 2px; color: #fff3d0; }
  .panel p { margin: 4px 0 12px; font-size: 13px; opacity: .85; }
  .stars { font-size: 30px; letter-spacing: 6px; color: #ffd779; text-shadow: 0 0 12px rgba(255,200,80,.7); }
  .stars i { font-style: normal; color: #4a4250; text-shadow: none; }
  .rw { display: flex; gap: 10px; justify-content: center; margin: 8px 0 14px; font-size: 15px; }
  .btns { display: flex; gap: 8px; justify-content: center; }
  .btn { font: inherit; font-family: Jua, sans-serif; font-size: 17px; padding: 9px 18px; border-radius: 10px; border: 0; cursor: pointer; }
  .btn.go { background: linear-gradient(#ffd779, #e0a12a); color: #2a1206; box-shadow: 0 3px 0 #9a6a10; }
  .btn.sub { background: rgba(255,255,255,.12); color: #f4efe3; border: 1px solid rgba(255,255,255,.25); }
  .tip { font-size: 12px; opacity: .75; margin-top: 10px; line-height: 1.5; }
  .cast.show { opacity: 1; }
  .syn:empty { display: none; }
  .syn b + b { margin-left: 10px; }
  .dmg.say { font-family: 'Gowun Dodum', sans-serif; font-weight: 700; font-size: 13px; color: #fff; text-shadow: 0 1px 3px #000, 0 0 6px rgba(0,0,0,.6); white-space: nowrap; }
  #dim { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 62% 42%, rgba(0,0,0,0) 0 16%, rgba(4,2,10,.6) 45%, rgba(4,2,10,.9) 80%); opacity: 0; transition: opacity .25s; z-index: 1; }
  #dim.on { opacity: 1; }
  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 2; mix-blend-mode: screen; }
  .sk.sleep { filter: saturate(.4) brightness(.7) hue-rotate(200deg); }
  .sk.sleep::after { content: 'Zz 잠듦'; position: absolute; inset: 0 0 22px 0; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #cfe0ff; }
  .panel p small { opacity: .8; }
  #reveal { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; pointer-events: none; background: radial-gradient(circle, rgba(10,30,16,.55), rgba(0,0,0,.85)); }
  #reveal[hidden] { display: none; }
  #reveal .rv-card { width: min(260px, 70vw); background: #0f1a14; border: 2px solid #5dff8a; border-radius: 14px; padding: 10px; text-align: center; box-shadow: 0 0 40px rgba(93,255,138,.5); }
  #reveal img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 8px; display: block; }
  #reveal b { display: block; font-family: Jua, sans-serif; font-weight: 400; font-size: 20px; color: #9dffb0; margin-top: 8px; }
  #reveal small { color: #cfe8d6; font-size: 12px; }
  #reveal.show { animation: rv-bg 2.8s ease forwards; } #reveal.show .rv-card { animation: rv-card 2.8s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes rv-bg { 0% { opacity: 0; } 8% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes rv-card { 0% { transform: scale(.3) rotate(-8deg); opacity: 0; } 14% { transform: scale(1.06) rotate(2deg); opacity: 1; } 22% { transform: scale(1) rotate(0); } 85% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.1); opacity: 0; } }
  /* ───── 카툰 + 학교 문구 스킨 ───── */
  :root { --ink: #231c17; --paper: #fffaf0; --paper2: #f1e7d0; --yellow: #ffd23f; --red: #e5484d; --green: #2b4a3c; }
  .glass { background: var(--paper); color: var(--ink); border: 2.5px solid var(--ink); box-shadow: 0 3px 0 var(--ink); backdrop-filter: none; -webkit-backdrop-filter: none; }
  .ico { display: block; flex: 0 0 auto; }
  .stage { border-radius: 12px; padding: 4px 12px 5px; font-size: 12px; font-weight: 700; letter-spacing: 0; transform: rotate(-1.5deg); }
  .stage #stg { display: inline-block; background: var(--green); color: #fff; border-radius: 6px; padding: 0 6px; margin-right: 2px; font-family: Jua, sans-serif; font-weight: 400; font-size: 13px; }
  .stage b { font-size: 20px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .ctl { gap: 8px; }
  .ctl button { display: grid; place-items: center; min-width: 40px; height: 40px; padding: 0 10px; border-radius: 12px; font-family: Jua, sans-serif; font-weight: 400; font-size: 15px; letter-spacing: 0; color: var(--ink); transition: transform .12s cubic-bezier(.22,1,.36,1), box-shadow .12s; }
  .ctl button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .ctl button.on { background: var(--yellow); color: var(--ink); border-color: var(--ink); }
  .bname { text-shadow: none; gap: 6px; margin-bottom: 4px; }
  .bname b { font-size: 20px; color: #fff; letter-spacing: 0; text-shadow: -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink), 2px 2px 0 var(--ink), 0 3px 0 var(--ink); }
  .bname i { font-size: 12px; font-family: Jua, sans-serif; letter-spacing: 0; color: #fff; background: var(--red); border: 2px solid var(--ink); padding: 0 6px; border-radius: 6px; transform: rotate(-4deg); }
  .bbar { height: 20px; border-radius: 10px; background: #3a2a24; border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); }
  .bbar .layer, .bbar .trail { border-radius: 0; }
  .bbar .next { background: #8a3a2a; }
  .bbar .trail { background: #fff3c4; }
  .bbar .now { background: var(--red); box-shadow: inset 0 -4px 0 rgba(0,0,0,.18); }
  .bbar .shine { left: 6px; right: 6px; top: 3px; height: 3px; background: rgba(255,255,255,.45); }
  .bcount { font-size: 15px; margin-top: 20px; color: var(--ink); background: var(--yellow); border: 2.5px solid var(--ink); border-radius: 8px; padding: 0 6px; text-shadow: none; box-shadow: 0 2px 0 var(--ink); }
  .syn { top: 66px; border-radius: 10px; font-size: 12px; padding: 3px 9px; transform: rotate(1deg); }
  .syn b { color: #1d5bd8; }
  .skills { gap: 10px; bottom: 10px; }
  .sk { width: 80px; height: 100px; border-radius: 10px; background: var(--paper); border: 2.5px solid var(--ink); box-shadow: 0 4px 0 var(--ink); overflow: hidden; transition: transform .16s cubic-bezier(.22,1,.36,1), box-shadow .16s; }
  .sk .face { inset: 0 0 26px 0; border-bottom: 2.5px solid var(--ink); }
  .sk .face img { width: 82px; bottom: -8px; }
  .sk b { height: 26px; line-height: 24px; background: var(--paper); color: var(--ink); font-family: Jua, sans-serif; font-weight: 400; font-size: 13px; letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: clip; }
  .sk .cd { inset: 0 0 26px 0; background: conic-gradient(rgba(35,28,23,.68) var(--p), transparent 0); font-size: 28px; color: #fff; text-shadow: -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink), 2px 2px 0 var(--ink); }
  .sk.ready { border-color: var(--ink); background: var(--yellow); box-shadow: 0 6px 0 var(--ink); transform: translateY(-6px); }
  .sk.ready b { background: var(--yellow); }
  .sk.ready:active { transform: translateY(-1px); box-shadow: 0 1px 0 var(--ink); }
  .sk .ult { top: 4px; right: auto; left: 50%; transform: translateX(-50%) rotate(-5deg); font-family: Jua, sans-serif; font-weight: 400; font-size: 13px; letter-spacing: 0; color: var(--ink); background: var(--yellow); border: 2px solid var(--ink); padding: 0 7px; border-radius: 6px; animation: none; }
  .sk.dead { filter: grayscale(1) brightness(.75); }
  .sk.dead::after { content: '쓰러짐'; inset: 26px 6px auto 6px; height: 26px; display: grid; place-items: center; font-family: Jua, sans-serif; font-size: 15px; color: var(--red); border: 2.5px solid var(--red); border-radius: 6px; background: rgba(255,250,240,.85); transform: rotate(-10deg); }
  .sk.sleep::after { content: 'Zz'; inset: 0 0 26px 0; font-family: Jua, sans-serif; font-size: 26px; color: #fff; text-shadow: -2px -2px 0 #3a3aa0, 2px 2px 0 #3a3aa0; }
  .cast { top: 18%; padding: 4px 22px; background: var(--yellow); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); transform: translateX(-50%) rotate(-2deg); }
  .cast b { font-size: 24px; color: var(--ink); letter-spacing: 0; }
  .cast small { color: var(--ink); opacity: .75; font-weight: 700; }
  .dmg { --o: var(--ink); text-shadow: -2px -2px 0 var(--o), 2px -2px 0 var(--o), -2px 2px 0 var(--o), 2px 2px 0 var(--o), 0 3px 0 var(--o); }
  .dmg.big { color: var(--yellow); font-size: 42px; text-shadow: -3px -3px 0 var(--ink), 3px -3px 0 var(--ink), -3px 3px 0 var(--ink), 3px 3px 0 var(--ink), 0 5px 0 var(--ink); }

  .dmg.mid { font-size: 24px; color: #fff; }
  .dmg.heal { color: #7cf0a0; }
  .dmg.taken { color: #ff8a80; }
  .dmg.block { color: #9ec9ff; }
  .dmg.info { color: var(--yellow); font-size: 24px; white-space: nowrap; }
  .dmg.say { font-family: 'Gowun Dodum', sans-serif; font-weight: 700; font-size: 13px; color: var(--ink); text-shadow: none; background: var(--paper); border: 2px solid var(--ink); border-radius: 12px; padding: 3px 9px; box-shadow: 0 2px 0 var(--ink); }
  .dmg.say::after { content: ''; position: absolute; left: 50%; bottom: -7px; width: 9px; height: 9px; background: var(--paper); border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink); transform: translateX(-50%) rotate(45deg); }
  .unit { width: 46px; }
  .unit .bar { height: 7px; border-radius: 4px; background: #3a2a24; border: 2px solid var(--ink); box-shadow: none; }
  .unit .bar i { background: #5fd17f; }
  .overlay { background: rgba(20,16,12,.55); }
  .panel { position: relative; color: var(--ink); border-radius: 6px 14px 14px 6px; padding: 18px 26px 20px 40px; min-width: 300px; max-width: 92vw; background: var(--paper) repeating-linear-gradient(transparent 0 23px, rgba(91,141,239,.22) 23px 24px); background-color: var(--paper); transform: rotate(-1deg); }
  .panel::before { content: ''; position: absolute; left: 24px; top: 0; bottom: 0; width: 2px; background: rgba(229,72,77,.5); }
  .panel small { letter-spacing: 0; font-size: 12px; font-weight: 700; color: #8a7a64; }
  .panel h2 { font-size: 36px; color: var(--ink); }

  @keyframes starPop { from { transform: scale(0) rotate(-30deg); } }
  .sk .face img { width: 76px; bottom: -2px; }

  #install-tip .it-box { width: min(360px, 100%); background: #fffaf0; color: #231c17; border: 3px solid #231c17; border-radius: 14px; box-shadow: 0 5px 0 #231c17; padding: 14px 16px; text-align: center; font-family: 'Gowun Dodum', sans-serif; }

  /* 노치 · 가로 화면 */
  .stage { left: max(12px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top)); }
