<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D 친구 시안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
  :root { --ink: #231c17; --paper: #fffaf0; }
  html, body { margin: 0; height: 100%; background: #bfe3f5; font-family: 'Gowun Dodum', sans-serif; color: var(--ink); overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .tag { position: fixed; top: 12px; left: 12px; background: var(--paper); border: 2.5px solid var(--ink); box-shadow: 0 3px 0 var(--ink); border-radius: 12px; padding: 4px 12px; font-family: Jua, sans-serif; font-size: 18px; }
  .row { position: fixed; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .row figure { margin: 0; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 10px; box-shadow: 0 3px 0 var(--ink); text-align: center; padding: 2px 4px 4px; }
  .row img { display: block; width: 52px; height: 108px; }
  .row figcaption { font-family: Jua, sans-serif; font-size: 12px; }
  .btns { position: fixed; top: 60px; left: 12px; right: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  .btns button { font-family: Jua, sans-serif; font-size: 15px; background: var(--paper); border: 2.5px solid var(--ink); box-shadow: 0 3px 0 var(--ink); border-radius: 10px; padding: 6px 12px; cursor: pointer; }
  .btns button.on { background: #ffd23f; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="tag">3D 친구 시안 · 아래는 지금 그림</div>
<div class="btns"><button data-m="idle" class="on">가만히</button><button data-m="habit">버릇</button><button data-m="walk">걷기</button><button data-m="attack">공격</button><button data-m="throw">던지기</button><button data-m="cast">필살기</button><button data-m="hit">맞기</button><button data-m="down">쓰러짐</button><button data-m="cheer">환호</button></div>
<div class="row" id="row"></div>
<script src="../avatar.js"></script>
<script src="../avatar2.js"></script>
<script src="../avatar3.js"></script>
<script src="../scene.js"></script>
<script src="../fullbody.js"></script>
<script src="roster.js"></script>
<script src="kits.js"></script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { makeChibi } from './chibi3d.js';
const IDS = (new URLSearchParams(location.search).get('ids') || 'junyoung,jeonggyu,yunsu,seojun,yejun,yeonju,sihyeon,baekho').split(',');
const nameOf = id => (ROSTER.find(f => f.id === id) || { name: id }).name;
document.getElementById('row').innerHTML = IDS.map(id => `<figure><img src="${svgURL(kitSVG(id, 'stand', 'smile'))}" alt=""><figcaption>${nameOf(id)}</figcaption></figure>`).join('');
const canvas = document.getElementById('c'), renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.shadowMap.enabled = true; renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#bfe3f5');
const cam = new THREE.PerspectiveCamera(30, 1, .1, 100);
scene.add(new THREE.HemisphereLight('#ffffff', '#8aa0b0', 1.2));
const sun = new THREE.DirectionalLight('#ffffff', 2); sun.position.set(3, 8, 6); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 6, bottom: -4 }); scene.add(sun);
const floor = new THREE.Mesh(new THREE.CircleGeometry(14, 48), new THREE.MeshToonMaterial({ color: '#8fcf6a' })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const kids = IDS.map((id, i) => { const k = makeChibi(id); k.position.set((i - (IDS.length - 1) / 2) * 1.55, 0, 0); k.rotation.y = (i - (IDS.length - 1) / 2) * -.06; scene.add(k); return k; });
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); cam.aspect = w / h; const span = IDS.length * 1.55 + 1; const d = Math.max(9, span / 2 / Math.tan(15 * Math.PI / 180) / cam.aspect * 1.05); cam.position.set(0, 3.2, d); cam.lookAt(0, 1.25, 0); cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
document.querySelectorAll('.btns button').forEach(b => b.onclick = () => { document.querySelectorAll('.btns button').forEach(x => x.classList.toggle('on', x === b)); kids.forEach(k => { const c = k.userData.chibi; if (b.dataset.m === 'habit') c.habitNow(); else c.set(b.dataset.m); }); });
let spin = 0; const clock = new THREE.Clock();
renderer.setAnimationLoop(() => { const dt = Math.min(clock.getDelta(), .05); kids.forEach(k => k.userData.chibi.update(dt)); renderer.render(scene, cam); });
window.__proto = { kids, set: m => kids.forEach(k => { const c = k.userData.chibi; if (m === 'habit') c.habitNow(); else c.set(m); }), turn: a => kids.forEach(k => { k.rotation.y = a; }) };
</script>
</body>
</html>
