<script type="module">
import { shootAll, openViewer, closeViewer } from './chibishot.js';
window.CHIBI_IMG = window.CHIBI_IMG || {}; window.openViewer = openViewer; window.closeViewer = closeViewer;
// 팀 → 내 친구 순서로, 상반신(카드)과 전신(배치 칸)을 찍어서 바로 바꿔 끼운다
const ids = [...new Set([...team, ...owned])], jobs = [];
team.forEach(id => jobs.push({ id, kind: 'full', w: 132, h: 276 }));
ids.forEach(id => jobs.push({ id, kind: 'bust', w: 128, h: 128 }));
ids.forEach(id => { if (!team.includes(id)) jobs.push({ id, kind: 'full', w: 132, h: 276 }); });
shootAll(jobs, (j, url) => { const key = (j.kind === 'bust' ? 'h' : 'f') + j.id; CHIBI_IMG[key] = url; document.querySelectorAll(`img[data-${key[0]}="${j.id}"]`).forEach(img => { img.src = url; }); });
</script>
