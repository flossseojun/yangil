<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>팀 편성</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
  :root { --gold: #ffd779; --ink: #f4efe3; --muted: #b9b2c4; --panel: rgba(18, 14, 28, .72); --line: rgba(255, 214, 120, .28); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: radial-gradient(120% 90% at 20% 0%, #4a2a52, #1a1226 55%, #0e0a16); color: var(--ink); font-family: 'Gowun Dodum', sans-serif; }
  body { padding: max(10px, env(safe-area-inset-top)) 12px 12px; }
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .top a { color: var(--muted); text-decoration: none; font-size: 13px; }
  .top h1 { font-family: Jua, sans-serif; font-weight: 400; font-size: 22px; margin: 0; color: #fff3d0; }
  .top .stage { margin-left: auto; font-size: 12px; color: var(--muted); text-align: right; }
  .top .stage b { display: block; font-family: Jua, sans-serif; font-weight: 400; font-size: 15px; color: var(--ink); }
  .wrap { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 12px; }
  @media (max-width: 720px) { .wrap { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  .field { position: relative; height: 250px; border-radius: 10px; overflow: hidden; background: linear-gradient(#3a2448 0 40%, #6b4a40 40% 100%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
  .field::before { content: ''; position: absolute; left: 0; right: 0; top: 40%; bottom: 0; background: repeating-linear-gradient(90deg, rgba(0,0,0,.12) 0 1px, transparent 1px 48px), repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 1px, transparent 1px 34px); }
  .row-lab { position: absolute; top: 8px; font-size: 10px; letter-spacing: .14em; color: var(--muted); background: rgba(0,0,0,.35); padding: 2px 7px; border-radius: 4px; }
  .slot { position: absolute; width: 66px; transform: translateX(-50%); text-align: center; cursor: pointer; }
  .slot img { position: relative; display: block; width: 66px; height: 138px; filter: drop-shadow(0 6px 6px rgba(0,0,0,.45)); }
  .slot .nm { position: relative; margin-top: 2px; font-size: 11px; white-space: nowrap; font-weight: 700; background: rgba(10,8,16,.8); border-radius: 6px; padding: 2px 0; display: flex; align-items: center; justify-content: center; gap: 3px; }
  .slot.empty { height: 120px; top: 70px !important; }
  .slot.empty::before { content: '+'; display: grid; place-items: center; width: 56px; height: 56px; margin: 20px auto 0; border: 2px dashed rgba(255,255,255,.35); border-radius: 50%; font-size: 26px; color: rgba(255,255,255,.5); }
  .ring { position: absolute; top: 124px; left: 50%; width: 50px; height: 13px; transform: translateX(-50%); border-radius: 50%; border: 2px solid var(--c); opacity: .7; }
  .syn { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .syn span { font-size: 12px; padding: 4px 9px; border-radius: 8px; border: 1px solid rgba(255,255,255,.14); color: var(--muted); }
  .syn span b { font-weight: 700; margin-right: 4px; }
  .syn span.on { color: #fff3d0; border-color: rgba(159, 211, 255, .7); background: rgba(80, 120, 200, .25); }
  .syn span.on b { color: #9fd3ff; }
  .foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .btn { white-space: nowrap; }
  .pow { font-family: Jua, sans-serif; font-size: 17px; color: #fff3d0; }
  .pow small { font-family: 'Gowun Dodum'; font-size: 11px; color: var(--muted); margin-left: 4px; }
  .btn { font: inherit; border: 0; border-radius: 10px; cursor: pointer; }
  .btn.go { margin-left: auto; font-family: Jua, sans-serif; font-size: 18px; padding: 10px 22px; background: linear-gradient(#ffd779, #e0a12a); color: #2a1206; box-shadow: 0 3px 0 #9a6a10; }
  .btn.go:disabled { filter: grayscale(1) brightness(.6); cursor: not-allowed; }
  .btn.sub { font-size: 13px; padding: 8px 12px; background: rgba(255,255,255,.1); color: var(--ink); border: 1px solid rgba(255,255,255,.2); }
  .tabs { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
  .tabs button { font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); background: transparent; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .tabs button.on { background: rgba(255, 214, 120, .18); color: #fff3d0; border-color: var(--gold); }
  .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 7px; max-height: 330px; overflow-y: auto; padding: 2px; }
  @media (max-width: 720px) { .list { max-height: none; } }
  .card { position: relative; border-radius: 10px; padding: 6px 6px 7px; background: linear-gradient(160deg, var(--bg), #120e1c); border: 1px solid rgba(255,255,255,.12); cursor: pointer; text-align: center; font: inherit; color: var(--ink); }
  .card img { display: block; width: 58px; height: 58px; margin: 0 auto; }
  .card b { display: block; font-family: Jua, sans-serif; font-weight: 400; font-size: 14px; margin-top: 1px; }
  .card .rl { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; color: var(--muted); }
  .card .sk { display: block; font-size: 11px; color: #fff3d0; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card.on { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 14px rgba(255, 200, 80, .35); }
  .card.on::after { content: attr(data-n); position: absolute; top: 5px; right: 5px; width: 18px; height: 18px; line-height: 18px; border-radius: 50%; background: var(--gold); color: #2a1206; font-size: 11px; font-weight: 700; }
  .card.full { opacity: .62; }
  .hint { font-size: 12px; color: var(--muted); margin: 8px 2px 0; line-height: 1.5; }
  .roles { font-size: 11px; color: var(--muted); margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .roles span { display: inline-flex; align-items: center; gap: 4px; }
</style>
</head>
<body>
<div class="top"><a href="./">← 캠퍼스</a><h1>팀 편성</h1><div class="stage">STAGE 1-1<b>은행나무길 · 은행왕</b></div></div>
<div class="wrap">
  <section class="panel">
    <div class="field" id="field"></div>
    <div class="syn" id="syn"></div>
    <div class="foot"><span class="pow" id="pow"></span><button class="btn sub" id="auto">자동 편성</button><button class="btn go" id="go">전투 시작</button></div>
  </section>
  <section class="panel">
    <div class="tabs" id="tabs"></div>
    <div class="list" id="list"></div>
    <div class="roles" id="roles"></div>
    <p class="hint" id="hint"></p>
  </section>
</div>
<script src="../avatar.js"></script>
<script src="../avatar2.js"></script>
<script src="../avatar3.js"></script>
<script src="../scene.js"></script>
<script src="../fullbody.js"></script>
<script src="roster.js"></script>
<script src="kits.js"></script>
<script src="team.js"></script>
</body>
</html>
